name: Terraform CD
run-name: CD-${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  TERRAFORM_WORKING_DIR: subscriptions-vending
  POST_DEPLOY_TEST_SCRIPT: test/test_subscription_vending.py

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      jira_issue_key: ${{ steps.jira.outputs.jira_issue_key }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Derive JIRA issue key
        id: jira
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(subscriptions/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "subscriptions 配下に YAML が見つかりません" >&2
            exit 1
          fi
          JIRA_ISSUE_KEY=$(python -c "import sys,yaml; print(yaml.safe_load(open(sys.argv[1], encoding='utf-8'))['subscription_request']['jira_issue_key'])" "${files[0]}")
          echo "jira_issue_key=${JIRA_ISSUE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore previous tfstate artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ github.token }}
          workflow: terraform-cd.yml
          workflow_conclusion: completed
          branch: main
          name: tfstate-${{ steps.jira.outputs.jira_issue_key }}
          path: ${{ env.TERRAFORM_WORKING_DIR }}
          if_no_artifact_found: warn
          search_artifacts: true

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
        with:
          terraform_version: ~> 1.12
          terraform_wrapper: false

      - name: Terraform Init (local state)
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          set +e
          terraform plan -no-color -input=false -out=tfplan -detailed-exitcode 2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [[ $EXIT_CODE -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "### ✅ Plan: 変更なし" >> "$GITHUB_STEP_SUMMARY"
            echo "インフラは最新の状態です。apply はスキップされます。" >> "$GITHUB_STEP_SUMMARY"
          elif [[ $EXIT_CODE -eq 2 ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "### 📋 Plan: 変更あり " >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "以下の変更が apply されます。\`Apply\` " >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            # サマリー行（Plan: X to add, Y to change, Z to destroy）
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^Plan:|^Changes to Outputs' plan-output.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            # リソース変更一覧
            echo "#### リソース変更一覧" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^  # .* (will be|must be)' plan-output.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>📄 Plan 全文（クリックで展開）</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -c 65000 plan-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "### ❌ Plan: エラー" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -50 plan-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload Plan Artifact
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-${{ steps.jira.outputs.jira_issue_key }}
          path: |
            ${{ env.TERRAFORM_WORKING_DIR }}/tfplan
            ${{ env.TERRAFORM_WORKING_DIR }}/plan-output.txt
            ${{ env.TERRAFORM_WORKING_DIR }}/terraform.tfstate
            ${{ env.TERRAFORM_WORKING_DIR }}/terraform.tfstate.backup
          retention-days: 1

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    environment: azure

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
        with:
          terraform_version: ~> 1.12
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Terraform Init (local state)
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Download Plan Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-plan-${{ needs.plan.outputs.jira_issue_key }}
          path: ${{ env.TERRAFORM_WORKING_DIR }}

      - name: Terraform Apply
        id: terraform_apply
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        shell: bash
        run: |
          set +e
          terraform apply -auto-approve -input=false tfplan
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save latest tfstate artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfstate-${{ needs.plan.outputs.jira_issue_key }}
          path: |
            ${{ env.TERRAFORM_WORKING_DIR }}/terraform.tfstate
            ${{ env.TERRAFORM_WORKING_DIR }}/terraform.tfstate.backup
          retention-days: 30
          overwrite: true

      - name: Wait before post-deploy tests
        if: steps.terraform_apply.outputs.exit_code == '0'
        run: sleep 90

      - name: Run post-deploy tests
        if: steps.terraform_apply.outputs.exit_code == '0'
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          files=(subscriptions/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "### ❌ Post-deploy test result" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "subscriptions 配下に YAML が見つかりません" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          : > post-test-output.txt
          TEST_EXIT_CODE=0

          for file in "${files[@]}"; do
            python "${{ env.POST_DEPLOY_TEST_SCRIPT }}" "$file" 2>&1 | tee -a post-test-output.txt
            CURRENT_EXIT_CODE=${PIPESTATUS[0]}
            if [[ $CURRENT_EXIT_CODE -ne 0 ]]; then
              TEST_EXIT_CODE=$CURRENT_EXIT_CODE
            fi
            echo '' | tee -a post-test-output.txt
          done

          if [[ $TEST_EXIT_CODE -eq 0 ]]; then
            echo "### ✅ Post-deploy test result" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Post-deploy test result" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat post-test-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Prepare move applied YAMLs
        if: steps.terraform_apply.outputs.exit_code == '0'
        id: move
        shell: bash
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          set -euo pipefail
          mkdir -p subscriptions/created
          shopt -s nullglob
          files=(subscriptions/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mv subscriptions/*.yaml subscriptions/created/
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request for moved YAMLs
        if: steps.terraform_apply.outputs.exit_code == '0' && steps.move.outputs.moved == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "${{ needs.plan.outputs.jira_issue_key }}-Move applied subscription YAMLs to created"
          branch: "automation/move-applied-subscription-yamls-${{ github.run_id }}"
          base: main
          title: "${{ needs.plan.outputs.jira_issue_key }}-Move applied subscription YAMLs to created"
          add-paths: |
            ${{ env.TERRAFORM_WORKING_DIR }}/subscriptions/*.yaml
            ${{ env.TERRAFORM_WORKING_DIR }}/subscriptions/created/*.yaml
          body: |
            ## 概要
            Terraform Apply 成功後、処理済みの subscription YAML を `subscriptions/` から `subscriptions/created/` へ移動しました。

            ## 背景
            - このリポジトリではサブスクリプション払い出しを使い捨て運用とする
            - local state のため、再実行対象から外すために YAML を退避する

            ## 変更内容
            - `${{ env.TERRAFORM_WORKING_DIR }}/subscriptions/*.yaml` → `${{ env.TERRAFORM_WORKING_DIR }}/subscriptions/created/` に移動

            ## 備考
            - この PR は Terraform CD workflow により自動作成されています。
          delete-branch: false

      - name: Fail workflow if apply failed
        if: steps.terraform_apply.outputs.exit_code != '0'
        run: exit 1
