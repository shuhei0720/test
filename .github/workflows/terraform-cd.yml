name: Terraform CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  TERRAFORM_WORKING_DIR: subscriptions-vending
  POST_DEPLOY_TEST_SCRIPT: test/test_subscription_vending.py

jobs:
  test:
    name: Python Test Only
    runs-on: ubuntu-latest
    environment: azure

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Run post-deploy tests
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          files=(subscriptions/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "### ❌ Post-deploy test result" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "subscriptions 配下に YAML が見つかりません" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          : > post-test-output.txt
          TEST_EXIT_CODE=0

          for file in "${files[@]}"; do
            echo "=== TEST TARGET: ${file} ===" | tee -a post-test-output.txt
            echo '$ az account show' | tee -a post-test-output.txt
            az account show 2>&1 | tee -a post-test-output.txt
            echo '' | tee -a post-test-output.txt
            echo '$ az account list --all' | tee -a post-test-output.txt
            az account list --all 2>&1 | tee -a post-test-output.txt
            echo '' | tee -a post-test-output.txt
            echo '$ python "${{ env.POST_DEPLOY_TEST_SCRIPT }}" "'"${file}"'"' | tee -a post-test-output.txt
            python "${{ env.POST_DEPLOY_TEST_SCRIPT }}" "$file" 2>&1 | tee -a post-test-output.txt
            CURRENT_EXIT_CODE=${PIPESTATUS[0]}
            if [[ $CURRENT_EXIT_CODE -ne 0 ]]; then
              TEST_EXIT_CODE=$CURRENT_EXIT_CODE
            fi
            echo '' | tee -a post-test-output.txt
          done

          if [[ $TEST_EXIT_CODE -eq 0 ]]; then
            echo "### ✅ Post-deploy test result" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Post-deploy test result" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat post-test-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          exit $TEST_EXIT_CODE
